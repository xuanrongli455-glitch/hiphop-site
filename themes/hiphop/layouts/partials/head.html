<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.classList.add('js');</script>
<title>{{ if .IsHome }}{{ .Site.Title }} — 说唱 / 街舞 / 潮流文化{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
{{ $font := resources.Get "fonts/anton-latin-400.woff2" | fingerprint }}
<style>
@font-face {
  font-family: "Anton"; font-style: normal; font-weight: 400; font-display: swap;
  src: url("{{ $font.RelPermalink }}") format("woff2");
}
</style>
{{ $css := resources.Get "css/main.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">
<noscript><style>.reveal { opacity: 1 !important; transform: none !important; }</style></noscript>
