<header class="site-header" id="siteHeader">
  <div class="wrap header-inner">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <svg width="42" height="42" viewBox="0 0 64 64">
          <defs>
            <filter id="brushRough" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
              <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
            </filter>
          </defs>
          <g filter="url(#brushRough)">
            <path d="M16 10 L28 10 L24 28 L36 28 L40 10 L52 10 L44 54 L32 54 L36 34 L24 34 L20 54 L8 54 Z" fill="#ffffff"/>
          </g>
        </svg>
      </span>
      <span class="brand-text">HIPHOP<em>中文站</em></span>
    </a>
    <nav class="site-nav" id="siteNav">
      {{ $cur := .RelPermalink }}
      <a href="/news/"{{ if hasPrefix $cur "/news/" }} class="active"{{ end }}>资讯</a>
      <a href="/music/"{{ if hasPrefix $cur "/music/" }} class="active"{{ end }}>新歌推荐</a>
      <a href="/underground/"{{ if hasPrefix $cur "/underground/" }} class="active"{{ end }}>地下新声</a>
      <a href="/genres/"{{ if hasPrefix $cur "/genres/" }} class="active"{{ end }}>说唱分支</a>
      <a href="/artists/"{{ if hasPrefix $cur "/artists/" }} class="active"{{ end }}>艺人/厂牌</a>
      <a href="/samples/"{{ if hasPrefix $cur "/samples/" }} class="active"{{ end }}>采样考古</a>
      <a href="/events/"{{ if hasPrefix $cur "/events/" }} class="active"{{ end }}>演出日历</a>
      <a href="/timeline/"{{ if hasPrefix $cur "/timeline/" }} class="active"{{ end }}>编年史</a>
      <a href="/about/"{{ if hasPrefix $cur "/about/" }} class="active"{{ end }}>关于</a>
    </nav>
    <a class="header-cta" href="/submit/">投稿</a>
    <button class="menu-btn" id="menuBtn" aria-label="菜单">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
