{{/* 分轨式播放卡：圆形彩图 + 黑圆白三角按钮，点击跳转网易云音乐 App 听歌
  用法：{{< play163 id="网易云歌曲ID" title="歌曲名" >}} */}}
<div class="stem-player" data-song-id="{{ .Get "id" }}">
  <div class="stem-art">
    <div class="stem-ring stem-ring-1"><div class="stem-ring stem-ring-2"></div></div>
    <a class="stem-play" href="https://music.163.com/m/song/{{ .Get "id" }}" target="_blank" rel="noopener" aria-label="去网易云音乐听《{{ .Get "title" }}》"><span class="stem-play-glyph" aria-hidden="true">▶</span></a>
  </div>
  <div class="stem-wave" aria-hidden="true"></div>
  {{ with .Get "title" }}<p class="stem-title">《{{ . }}》</p>{{ end }}
  <p class="stem-tip">点击去网易云音乐 App 收听</p>
</div>
